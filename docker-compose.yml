# The multiplayer game server. The website runs on Vercel (or `npm run dev` locally).
services:
  game-server:
    build: .
    image: chicken-blasters-game:latest
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL}        # the same Supabase connection string as the website
      SESSION_SECRET: ${SESSION_SECRET}    # the same secret as the website
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}  # e.g. https://your-game.vercel.app
    restart: unless-stopped
